# ============================================================
# Portal unificado — Nginx
# Entrada única en :80. Las apps se sirven por subruta en el
# MISMO origen (sin puertos adicionales) y se incrustan desde el
# portal mediante iframes same-origin:
#
#   http://localhost/          -> Portal con pestañas
#   http://localhost/hmi/      -> crop-hmi (preprocesado)
#   http://localhost/merge/    -> crop-hmi (postprocesado: Fusionar)
#   http://localhost/train/    -> DefectFill webapp (entrenamiento)
#
# proxy_pass con "/" al final elimina el prefijo de la subruta, de
# modo que cada backend ve sus rutas originales (/api/..., /static/...).
# El prefijo se añade en el frontend vía window.APP_BASE (crop_hmi lo
# inyecta con APP_SUBPATH y el header X-Forwarded-Prefix; DefectFill lo
# lleva fijo en index.html).
# ============================================================
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Subidas grandes del dataset (hasta 500 MB en DefectFill).
    client_max_body_size 600m;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Redirecciones de la subruta sin barra final (para que las URLs
        # relativas de cada frontend resuelvan dentro de su subruta).
        location = /hmi { return 301 /hmi/; }
        location = /train { return 301 /train/; }
        location = /merge { return 301 /merge/; }

        # Portal y estáticos (sin caché para que los cambios se vean al instante)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ------------------------------------------------------------
        # Preprocesado — crop_hmi (Flask) bajo /hmi/
        # ------------------------------------------------------------
        location /hmi/ {
            proxy_pass http://crop-hmi:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /hmi;
            proxy_read_timeout 300s;
        }

        # ------------------------------------------------------------
        # Postprocesado — crop_hmi (Flask) bajo /merge/ (solo Fusionar)
        # ------------------------------------------------------------
        location /merge/ {
            proxy_pass http://crop-hmi:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /merge;
            proxy_read_timeout 300s;
        }

        # ------------------------------------------------------------
        # Entrenamiento — DefectFill (FastAPI) bajo /train/
        # (SSE del monitor de trabajos: sin buffering + timeouts largos)
        # ------------------------------------------------------------
        location /train/ {
            proxy_pass http://defectfill:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Headers de seguridad
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
