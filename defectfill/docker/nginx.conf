# ============================================================
# nginx.conf — Reverse proxy para DefectFill Web App
# ============================================================
# Se monta en docker-compose.prod.yml.
# El backend FastAPI corre en el contenedor "defectfill" puerto 8000.
# ============================================================

upstream defectfill_backend {
    server defectfill:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;   # permitir subida de datasets grandes

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # Headers de seguridad
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Cacheo de estáticos
    location /static/ {
        proxy_pass http://defectfill_backend;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SSE para streaming de logs (sin buffer)
    location /api/jobs/ {
        proxy_pass http://defectfill_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Subida de ficheros
    location /api/dataset/ {
        proxy_pass http://defectfill_backend;
        client_max_body_size 500M;
    }

    # Archivos servidos (output, generated, data)
    location /files/ {
        proxy_pass http://defectfill_backend;
        proxy_buffering off;
    }

    # API general
    location /api/ {
        proxy_pass http://defectfill_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://defectfill_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
